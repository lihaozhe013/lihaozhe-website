baseURL = 'https://lihaozhe013.github.io/lihaozhe-website/'
theme = "hugo-blog-awesome"
enableEmoji = true
ignoreErrors = ["additional-script-loading-error"]
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[services]
  [services.googleAnalytics]
    id = ''
  [services.disqus]
    shortname = ''

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# --- English (default) ---
[languages.en]
  locale = 'en-us'
  label = 'English'
  title = "Haozhe Li's Website"
  weight = 1
  [languages.en.params]
    sitename = "Haozhe's Website"
    description = "Haozhe's Personal Website"
  [[languages.en.menu.main]]
    pageRef = "/"
    name = 'Home'
    url = '/'
    weight = 10
  [[languages.en.menu.main]]
    pageRef = "posts"
    name = 'Posts'
    url = '/posts/'
    weight = 20
  [[languages.en.menu.main]]
    pageRef = "about"
    name = 'About'
    url = '/about/'
    weight = 30

# --- 简体中文 ---
[languages.zh-cn]
  locale = 'zh-cn'
  label = '中文'
  title = "李浩哲的网站"
  weight = 2
  [languages.zh-cn.params]
    sitename = "浩哲的网站"
    description = ""
  [[languages.zh-cn.menu.main]]
    pageRef = "/"
    name = '首页'
    url = '/'
    weight = 10
  [[languages.zh-cn.menu.main]]
    pageRef = "posts"
    name = '文章'
    url = '/posts/'
    weight = 20
  [[languages.zh-cn.menu.main]]
    pageRef = "about"
    name = '关于'
    url = '/about/'
    weight = 30

# --- 全局参数 ---
[params]
  defaultColor = "auto"
  mainSections = ['posts']
  toc = true
  tocOpen = false
  goToTop = true
  math = true
  dateFormat = ""
  rssFeedDescription = "summary"

  [params.author]
    avatar = "avatar.svg"
    intro = "Haozhe Li's Website"
    name = "Haozhe Li"
    email = "lihaozhe013@gmail.com"
    description = "Welcome to my personal website where I write about my portfolio."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/lihaozhe013"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/lihaozhe013"

  [params.webmanifest]
    name = "Haozhe Li's Website"
    short_name = "Haozhe's Website"
    start_url = "/"
    theme_color = "#434648"
    background_color = "#fff"
    display = "standalone"

  [params.browserconfig]
    TileColor = "#2d89ef"
